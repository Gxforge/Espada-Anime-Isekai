name: Godot 4.4 CI - Forja de Almas 3D

on:
  push:
    branches: [ main, master, godot-migration, "codex/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-export:
    name: Validate & Export (Godot 4.4)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Godot version
        run: godot --version || true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi
          ls -la ~/.local/share/godot/export_templates/ || true

      - name: Headless import (validate project)
        working-directory: godot_project
        run: |
          godot --headless --editor --import --quit-after 60 || true
          echo "Import step finished"

      - name: Validate scripts parse (headless)
        working-directory: godot_project
        run: |
          # Run a quick headless check - open and quit
          timeout 120 godot --headless --path . --quit-after 30 || true
          echo "Headless validation finished"

      - name: Export Linux build
        working-directory: godot_project
        run: |
          mkdir -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/ForjaDeAlmas3D.x86_64 || \
          godot --headless --verbose --export-debug "Linux" build/linux/ForjaDeAlmas3D.x86_64 || \
          echo "Export skipped (templates may be unavailable in this image tag)"
          ls -la build/linux || true

      - name: Upload Linux build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-de-almas-linux
          path: godot_project/build/linux/
          if-no-files-found: warn

      - name: Project structure report
        if: always()
        run: |
          echo "## Project Structure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 3D Models" >> $GITHUB_STEP_SUMMARY
          ls godot_project/assets/models/ >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scripts" >> $GITHUB_STEP_SUMMARY
          ls godot_project/scripts/ >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scenes" >> $GITHUB_STEP_SUMMARY
          ls godot_project/scenes/ >> $GITHUB_STEP_SUMMARY || true
