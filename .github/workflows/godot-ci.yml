name: Godot 4.4 CI - Forja de Almas 3D

on:
  push:
    branches: [ main, master, feature/godot-complete-reconstruction, "codex/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-test-export:
    name: Validate, Test & Export (Godot 4.4)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Godot version
        run: |
          set -euo pipefail
          godot --version
          godot --version | grep -q "4.4"

      - name: Setup export templates
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          if [ -d /root/.local/share/godot/export_templates/4.4.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.4.stable/* ~/.local/share/godot/export_templates/4.4.stable/
          elif [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          fi
          echo "== export templates =="
          find ~/.local/share/godot/export_templates -maxdepth 3 -type f | sort | head -40
          # Verify required templates exist for desktop exports
          TPL=~/.local/share/godot/export_templates/4.4.stable
          if [ ! -f "$TPL/linux_release.x86_64" ] && [ ! -f "$TPL/linux_debug.x86_64" ]; then
            echo "ERROR: Linux export templates not found in $TPL"
            exit 1
          fi
          if [ ! -f "$TPL/windows_release_x86_64.exe" ] && [ ! -f "$TPL/windows_debug_x86_64.exe" ]; then
            echo "ERROR: Windows export templates not found in $TPL"
            exit 1
          fi

      - name: Import project
        working-directory: godot_project
        run: |
          set -euo pipefail
          # Import assets/scripts; must complete successfully
          godot --headless --editor --path . --import --quit
          test -d .godot/imported
          echo "Import completed"

      - name: Run automated tests
        working-directory: godot_project
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/run_tests.gd

      - name: Validate required resources load
        working-directory: godot_project
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/run_tests.gd > /tmp/test_out.txt 2>&1
          cat /tmp/test_out.txt
          grep -q "0 failed" /tmp/test_out.txt

      - name: Export Linux build
        working-directory: godot_project
        run: |
          set -euo pipefail
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/ForjaDeAlmas3D.x86_64
          test -f build/linux/ForjaDeAlmas3D.x86_64
          file build/linux/ForjaDeAlmas3D.x86_64 || true
          ls -lh build/linux/

      - name: Export Windows build
        working-directory: godot_project
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/ForjaDeAlmas3D.exe
          test -f build/windows/ForjaDeAlmas3D.exe
          file build/windows/ForjaDeAlmas3D.exe || true
          ls -lh build/windows/

      - name: Upload Linux artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forja-de-almas-linux
          path: godot_project/build/linux/
          if-no-files-found: error

      - name: Upload Windows artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forja-de-almas-windows
          path: godot_project/build/windows/
          if-no-files-found: error

      - name: Test summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Godot 4.4 strict validation" >> $GITHUB_STEP_SUMMARY
          echo "- Automated tests: res://tests/run_tests.gd" >> $GITHUB_STEP_SUMMARY
          echo "- Linux export: ForjaDeAlmas3D.x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- Windows export: ForjaDeAlmas3D.exe" >> $GITHUB_STEP_SUMMARY
